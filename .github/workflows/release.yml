name: Release

# A tag v1.2.3 (or v1.2.3-beta.1, a pre-release) builds every package from the
# tagged commit and puts them in a draft release of that tag, with their
# checksums and a GitHub attestation of where each was built. Nothing is
# published until the draft is: check it, and that the Linux and macOS
# workflows passed on the same commit, then publish it on GitHub. The files
# have the same names in every release (cmake/SeventhSlidePackaging.cmake),
# so .../releases/latest/download/<name> is always the newest:
#
#   seventhslide-ubuntu-24.04-amd64.deb   Ubuntu 24.04, Mint 22
#   seventhslide-ubuntu-26.04-amd64.deb   Ubuntu 26.04 and what is built on it
#   seventhslide-fedora-x86_64.rpm        the current Fedora
#   SeventhSlide-macOS-arm64.dmg          macOS 26 and later, Apple silicon
#   SeventhSlide-Windows-x64-Setup.exe    Windows 10 1903 and later
#   SHA2-256SUMS                          the checksum of each
#
# Started by hand (Actions > Release > Run workflow) on any branch, it builds
# the packages and keeps them with the run, with no release: a trial before
# tagging. docs/BUILDING.md, "Releases", says how a release is made.
#
# The jobs that build have only read access; only the last one, which makes
# the release, can write. The actions from outside this repository are pinned
# to a commit, so a tag moved on them changes nothing here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag and CMakeLists.txt agree, or nothing is built.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      numbers: ${{ steps.version.outputs.numbers }}
      label: ${{ steps.version.outputs.label }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/release_version.py --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            python3 tools/release_version.py | tee -a "$GITHUB_OUTPUT"
          fi

  # Ubuntu 24.04's Qt is below the 6.8 floor, so this deb carries Qt from aqt
  # in /opt/seventhslide.
  deb-ubuntu-24-04:
    needs: version
    runs-on: ubuntu-24.04
    env:
      LABEL: ${{ needs.version.outputs.label }}
      DEB: build-package/deploy/seventhslide-ubuntu-24.04-amd64.deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        uses: ./.github/actions/linux-deps
        with:
          webengine: 'true'

      # dpkg-shlibdeps names what the program and its Qt need from the system
      # by the packages those libraries are in, so each must be installed
      # here: Qt's X11 platform, its WebEngine and its sound, and GTK, which
      # the GTK platform theme (the system's file dialogs) loads.
      - name: Install what the package depends on
        run: |
          sudo apt-get install -y dpkg-dev file \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libxkbfile1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libgbm1 libasound2t64 libgtk-3-0t64

      - name: Configure
        run: cmake --preset ubuntu-24.04-deb -DSEVENTHSLIDE_VERSION_LABEL="$LABEL"

      - name: Build
        run: cmake --build --preset ubuntu-24.04-deb --parallel

      - name: Package
        run: cpack --config build-package/CPackConfig.cmake

      # Every library the program and its Qt name is found, with no Qt but
      # its own. Then installed as a person would (apt installs what it
      # depends on, and the AppArmor profile is loaded), and the program
      # starts (as a server, which needs no display) and stops.
      - name: Check the package
        run: |
          dpkg-deb --info "$DEB"
          root=$(mktemp -d)
          dpkg-deb -x "$DEB" "$root"
          missing=$(find "$root/opt/seventhslide" -type f \( -name '*.so*' -o -perm -u+x \) \
            -exec sh -c 'file -b "$1" | grep -q ELF && ldd "$1" | grep "not found" | sed "s|^|$1:|"' _ {} \; || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          sudo apt-get install -y "./$DEB"
          if [ -d /sys/kernel/security/apparmor ]; then
            sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^seventhslide(-webengine)? '
            [ "$(sudo grep -cE '^seventhslide(-webengine)? ' /sys/kernel/security/apparmor/profiles)" = 2 ]
          fi
          env -u QT_ROOT_DIR -u Qt6_DIR -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u LD_LIBRARY_PATH \
            seventhslide --server help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-ubuntu-24.04
          path: ${{ env.DEB }}
          if-no-files-found: error

  # Built on the Ubuntu it is for, against Ubuntu's own Qt (6.10) in /usr.
  deb-ubuntu-26-04:
    needs: version
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      LABEL: ${{ needs.version.outputs.label }}
      DEB: build-package/deploy/seventhslide-ubuntu-26.04-amd64.deb
      DEBIAN_FRONTEND: noninteractive
    steps:
      # docs/BUILDING.md's packages, with Ubuntu's Qt 6 in place of aqt's, the QML
      # modules the app imports (for the QML compiler), dpkg-dev for
      # dpkg-shlibdeps, and git for the checkout.
      - name: Install the dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git file dpkg-dev \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-httpserver-dev \
            qt6-websockets-dev qt6-svg-dev qt6-shadertools-dev qt6-webengine-dev \
            qt6-webchannel-dev qt6-positioning-dev \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-effects qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qt-labs-folderlistmodel qml6-module-qtwebchannel qml6-module-qtwebengine \
            libmpv-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libswscale-dev libavdevice-dev libssl-dev libpipewire-0.3-dev \
            libgl-dev libegl-dev libxkbcommon-dev fonts-liberation \
            libwayland-dev wayland-protocols libxfixes-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake --preset ubuntu-26.04-deb -DSEVENTHSLIDE_VERSION_LABEL="$LABEL"

      - name: Build
        run: cmake --build --preset ubuntu-26.04-deb --parallel

      - name: Package
        run: cpack --config build-package/CPackConfig.cmake

      # Installed as a person would, with apt installing what it depends on,
      # and the program starts (as a server, which needs no display) and
      # stops.
      - name: Check the package
        run: |
          dpkg-deb --info "$DEB"
          apt-get install -y "./$DEB"
          seventhslide --server help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-ubuntu-26.04
          path: ${{ env.DEB }}
          if-no-files-found: error

  # Built on the Fedora it is for, against Fedora's own Qt and FFmpeg.
  rpm:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:latest
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      # The packages docs/BUILDING.md lists, rpm-build for CPack, and git for the
      # checkout.
      - name: Install the dependencies
        run: |
          dnf install -y git rpm-build cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtshadertools-devel \
            qt6-qthttpserver-devel qt6-qtwebsockets-devel qt6-qtsvg-devel \
            mpv-devel ffmpeg-free-devel liberation-sans-fonts \
            pipewire-devel openssl-devel qt6-qtwebengine-devel \
            wayland-devel wayland-protocols-devel libXfixes-devel qt6-qtbase-private-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake --preset fedora-rpm -DSEVENTHSLIDE_VERSION_LABEL="$LABEL"

      - name: Build
        run: cmake --build --preset fedora-rpm --parallel

      - name: Package
        run: cpack --config build-package/CPackConfig.cmake

      # What it needs is installable here, and the program starts (as a
      # server, which needs no display) and stops.
      - name: Check the package
        run: |
          rpm=build-package/deploy/seventhslide-fedora-x86_64.rpm
          rpm -qip "$rpm"
          rpm -qRp "$rpm"
          dnf install -y "./$rpm"
          seventhslide --server help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: build-package/deploy/seventhslide-fedora-x86_64.rpm
          if-no-files-found: error

  # SeventhSlide.app with Qt and the Homebrew libraries inside it, signed ad
  # hoc (no Developer ID, so not notarized): the macos_app target.
  dmg:
    needs: version
    runs-on: macos-26
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          brew install cmake ninja pkgconf qt mpv ffmpeg openssl
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset macos-dmg -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX/opt/qt" \
            -DSEVENTHSLIDE_VERSION_LABEL="$LABEL"

      - name: Build and package
        run: cmake --build --preset macos-dmg --parallel

      - name: Name the disk image
        run: mv build-package/deploy/SeventhSlide.dmg build-package/deploy/SeventhSlide-macOS-arm64.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: build-package/deploy/SeventhSlide-macOS-arm64.dmg
          if-no-files-found: error

  # MSYS2's UCRT64 toolchain and libraries (the windows-mingw preset), the
  # program gathered with every DLL it loads (packaging/windows/deploy.sh),
  # and an Inno Setup installer of it (packaging/windows/seventhslide.iss).
  exe:
    needs: version
    runs-on: windows-2025
    env:
      LABEL: ${{ needs.version.outputs.label }}
      VERSION: ${{ needs.version.outputs.version }}
      NUMBERS: ${{ needs.version.outputs.numbers }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The shell scripts keep their LF line ends; bash takes no CR.
      - name: Keep line ends as they are
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-declarative:p qt6-httpserver:p qt6-websockets:p
            qt6-svg:p qt6-shadertools:p qt6-tools:p
            mpv:p ffmpeg:p openssl:p

      - name: Configure
        run: cmake --preset windows-exe -DSEVENTHSLIDE_VERSION_LABEL="$LABEL"

      - name: Build
        run: cmake --build --preset windows-exe --parallel

      - name: Gather the program
        run: packaging/windows/deploy.sh build-package build-package/deploy/SeventhSlide

      # Both programs, started from the gathered folder with MSYS2 off PATH
      # (as servers, which need no display), start and stop: they need
      # nothing from there. A DLL missing is exit 0xC0000135.
      - name: Check the programs
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $dir = ".\build-package\deploy\SeventhSlide"
          $app = Start-Process -FilePath "$dir\seventhslide.exe" -ArgumentList '--server', 'help' `
            -Wait -PassThru -NoNewWindow
          if ($app.ExitCode -ne 0) { throw ("seventhslide.exe --server help: exit 0x{0:X}" -f $app.ExitCode) }
          & "$dir\seventhslide-server.exe" help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw ("seventhslide-server.exe help: exit 0x{0:X}" -f $LASTEXITCODE) }

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DAppNumbers=$env:NUMBERS" `
            "/DSourceDir=$PWD\build-package\deploy\SeventhSlide" `
            "/DOutputDir=$PWD\build-package\deploy" packaging\windows\seventhslide.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: exit $LASTEXITCODE" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe
          path: build-package/deploy/SeventhSlide-Windows-x64-Setup.exe
          if-no-files-found: error

  # A draft release of the tag, with every package, their checksums and the
  # attestation that this workflow built them from this commit
  # (gh attestation verify <file> --repo <owner>/<repo>).
  release:
    if: github.ref_type == 'tag'
    needs: [version, deb-ubuntu-24-04, deb-ubuntu-26-04, rpm, dmg, exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA2-256SUMS
          cat SHA2-256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "SeventhSlide $VERSION" --generate-notes
