name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # macOS 26 at least: the app needs it (CMakeLists.txt,
    # CMAKE_OSX_DEPLOYMENT_TARGET), and Homebrew's bottles there are built
    # for it.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # The tool scripts run on macOS's own Python too (3.9).
      - name: Layering, unused and tests
        run: |
          /usr/bin/python3 tools/core_layers.py
          /usr/bin/python3 tools/controller_deps.py
          /usr/bin/python3 tools/qml_unused.py
          /usr/bin/python3 tools/test_sleeps.py
          /usr/bin/python3 tools/hidden_tags.py

      - name: Install dependencies
        run: |
          brew install cmake ninja pkgconf qt mpv ffmpeg openssl
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      # Linux answers at all of 127.0.0.0/8; macOS only at the addresses on
      # lo0. The network tests that play other computers need these.
      - name: Loopback addresses for the network tests
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          for i in 1 2 3 4 5 6 7 8 9; do sudo ifconfig lo0 alias "127.0.1.$i" up; done

      - name: Configure
        run: cmake --preset macos-ci -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX/opt/qt"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 300 --parallel 3

      # A test program that crashed says only SIGSEGV. macOS keeps a report
      # of each crash, with the crashed thread's stack: print those stacks.
      - name: Stacks of the test programs that crashed
        if: failure()
        run: |
          /usr/bin/python3 - <<'EOF'
          import glob, json, os
          reports = sorted(glob.glob(os.path.expanduser(
              "~/Library/Logs/DiagnosticReports/seventhslide_tests_*.ips")))
          if not reports:
              print("No test program crashed.")
          for path in reports:
              with open(path) as f:
                  f.readline()  # the report's header
                  body = json.loads(f.read())
              images = body.get("usedImages", [])
              print("==", os.path.basename(path), body.get("exception", {}))
              for thread in body.get("threads", []):
                  if not thread.get("triggered"):
                      continue
                  for frame in thread.get("frames", [])[:60]:
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
                      print("  %s  %s" % (image, frame.get("symbol", hex(frame.get("imageOffset", 0)))))
          EOF

      # SeventhSlide.app with Qt and the Homebrew libraries inside it, signed
      # ad hoc (no Developer ID): what another Mac runs.
      - name: Package
        run: cmake --build build --target macos_app

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: SeventhSlide-macOS
          path: build/deploy/SeventhSlide.dmg
          if-no-files-found: error
