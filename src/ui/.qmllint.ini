; qmllint settings for the SeventhSlide QML module. The seventhslide_ui_qmllint
; targets read this; CI fails on anything left at warning level
; (tools/check_qmllint.py).
;
; Every name a file uses must resolve statically: files with delegates use
; "pragma ComponentBehavior: Bound", and delegates declare the model data they
; read as required properties. Under Bound a delegate that reads modelData
; without declaring it gets a ReferenceError at runtime, so UnqualifiedAccess
; stays a warning.
[Warnings]
UnqualifiedAccess=warning
